<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar sesión</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 380px; margin: 80px auto; }
    input { display: block; width: 100%; margin-bottom: 12px; padding: 8px; }
    button { padding: 8px 16px; }
    #msg { margin-top: 12px; color: crimson; }
  </style>
</head>
<body>
  <h2>Iniciar sesión</h2>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Correo electrónico" required />
    <input type="password" id="password" placeholder="Contraseña" required />
    <button type="submit">Entrar</button>
  </form>
  <div id="msg"></div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      document.getElementById("msg").textContent = res.ok
        ? `Bienvenido, ${data.user.name}`
        : data.error;
    });
  </script>
</body>
</html>
